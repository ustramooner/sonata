name: Windows

on:
  workflow_dispatch:
  push:
    branches: [ piper_tetun ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ piper_tetun ]

jobs:
  build:
    runs-on: windows-latest
    name: "build: windows-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # protoc is required by tonic (gRPC build)
      - name: Prepare protoc cache
        uses: actions/cache@v4
        id: protoc
        with:
          path: protoc
          key: protoc-26.1-win64
      - name: Download protoc
        if: steps.protoc.outputs.cache-hit != 'true'
        run: curl -L -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v26.1/protoc-26.1-win64.zip
      - name: Extract protoc
        if: steps.protoc.outputs.cache-hit != 'true'
        shell: pwsh
        run: Expand-Archive -Path protoc.zip -DestinationPath protoc -Force

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          save-always: 'true'
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-cargo

      - name: Cargo fetch
        run: cargo fetch
        env:
          PROTOC: ${{ github.workspace }}/protoc/bin/protoc.exe

      - name: Cargo build
        run: cargo build --release --package sonata-grpc
        env:
          PROTOC: ${{ github.workspace }}/protoc/bin/protoc.exe

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path "target/release/build" -Filter "espeak-phonemizer-*" | Select-Object -First 1
          Move-Item "$($buildDir.FullName)/out/share/espeak-ng-data" "target/release/espeak-ng-data"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonata-windows-${{ matrix.arch }}
          path: |
            target/release/sonata-grpc.exe
            target/release/espeak-ng-data

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonata-windows-x64
          path: release/

      - name: Zip release
        run: |
          cd release
          zip -r ../sonata-grpc.zip sonata-grpc.exe espeak-ng-data

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sonata-grpc.zip
          prerelease: ${{ contains(github.ref, '-') }}
